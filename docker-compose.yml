services:
  db:
    image: postgres:16-alpine
    container_name: orderhub-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-orderhub}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-orderhub}
      POSTGRES_DB: ${POSTGRES_DB:-orderhub}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - orderhub_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-orderhub} -d ${POSTGRES_DB:-orderhub}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  orderhub_pgdata:
